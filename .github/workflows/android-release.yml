name: Kate Release

on:
  push:
    branches: [ main, master ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s' "$SIGNING_KEY" | base64 -d > $GITHUB_WORKSPACE/kate.jks
          echo "JKS size: $(wc -c < $GITHUB_WORKSPACE/kate.jks) bytes"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Build & sign release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/kate.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify packaging
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "APK: $APK"
          unzip -v $APK | grep "\.so"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: kate-release-signed
          path: app/build/outputs/apk/release/*.apk
